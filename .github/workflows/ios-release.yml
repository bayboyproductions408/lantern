name: iOS Release (TestFlight)

# Manual only. Every run consumes macOS CI minutes and pushes a real build to
# TestFlight, so it should never fire on a plain push.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 1.0)'
        required: false
        default: '1.0'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      SCHEME: App
      PROJECT: ios/App/App.xcodeproj
      TEAM_ID: '87836YN962'
      BUNDLE_ID: com.bayboyproductions.lantern
      PROFILE_NAME: Lantern App Store

    steps:
      - uses: actions/checkout@v4

      # Capacitor 8's CLI refuses to run on anything below Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # Builds www/ with PLATFORM_TARGET=ios, which switches the donation rail
      # to IAP (hiding the Give tab) and strips the Stripe URLs from the bundle.
      - name: Build web assets for iOS
        run: node build-www.js ios

      - name: Fail if any external payment link reached the bundle
        run: |
          if grep -rq "buy\.stripe\.com" www/; then
            echo "::error::A Stripe payment URL is present in the iOS bundle. Apple rejects external purchase links."
            grep -rn "buy\.stripe\.com" www/ | head
            exit 1
          fi
          echo "No external payment links in www/ — good."

      - name: Capacitor sync
        run: npx cap sync ios

      # Capacitor 8 uses Swift Package Manager, so there is no CocoaPods step.

      - name: Import signing certificate
        env:
          CERT_B64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PASS=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN
          security default-keychain -s $KEYCHAIN
          security unlock-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN
          security set-keychain-settings -t 3600 -u $KEYCHAIN

          # tr strips any stray CR: the secrets are pasted from a Windows box,
          # and a single carriage return makes base64 reject the whole blob.
          echo "$CERT_B64" | tr -d '\r\n' | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k $KEYCHAIN -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on an interactive keychain prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" $KEYCHAIN > /dev/null
          rm -f /tmp/cert.p12

          echo "Signing identities available:"
          security find-identity -v -p codesigning $KEYCHAIN

      - name: Install provisioning profile
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISION_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | tr -d '\r\n' | base64 --decode > /tmp/profile.mobileprovision
          UUID=$(security cms -D -i /tmp/profile.mobileprovision \
            | plutil -extract UUID raw -o - -)
          cp /tmp/profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "Installed profile UUID: $UUID"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      # Build numbers must strictly increase per upload; run_number does that
      # for free. A hardcoded value collides on the second upload.
      - name: Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Lantern.xcarchive" \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Lantern.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ls -lh "$RUNNER_TEMP/export"

      # altool talks to App Store Connect with the same API key used elsewhere.
      # Deliberately no Fastlane: the previous project lost hours to macOS's
      # system Ruby, and this pipeline has no reason to depend on Ruby at all.
      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          # A PEM key must keep its line breaks but must not carry CRs.
          printf '%s\n' "$ASC_API_KEY_P8" | tr -d '\r' \
            > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
          rm -f ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Upload IPA as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lantern-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
