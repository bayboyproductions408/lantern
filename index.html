<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Lantern — The Bible, read aloud</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <header class="topbar">
    <button class="brand" data-nav="listen" title="Now playing">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c-1.3 2.4-3.9 3.6-3.9 6.6a3.9 3.9 0 0 0 7.8 0c0-3-2.6-4.2-3.9-6.6Z"/><path d="M7.4 12.6h9.2l1.3 7.2a1.5 1.5 0 0 1-1.5 1.7H7.6a1.5 1.5 0 0 1-1.5-1.7Z" opacity=".55"/></svg>
      <span>Lantern</span>
    </button>
    <div class="topbar-right">
      <button class="chip" id="translationChip" title="Change translation">KJV</button>
      <button class="icon-btn" data-nav="settings" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.6v3M12 18.4v3M21.4 12h-3M5.6 12h-3M18.6 5.4l-2.1 2.1M7.5 16.5l-2.1 2.1M18.6 18.6l-2.1-2.1M7.5 7.5 5.4 5.4"/></svg>
      </button>
    </div>
  </header>

  <main id="views">

    <!-- ── Listen ─────────────────────────────────────────────── -->
    <section class="view" data-view="listen">
      <div class="now">
        <p class="now-kicker" id="nowKicker">Continue listening</p>
        <h1 class="now-ref" id="nowRef">Genesis 1</h1>
        <p class="now-sub" id="nowSub">King James Version</p>
        <p class="now-source" id="nowSource"></p>

        <button class="play-hero" id="playHero" aria-label="Play">
          <svg class="ico-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6L19 12Z"/></svg>
          <svg class="ico-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="5" width="3.6" height="14" rx="1"/><rect x="13.4" y="5" width="3.6" height="14" rx="1"/></svg>
        </button>

        <div class="transport">
          <button class="icon-btn lg" id="prevChapter" title="Previous chapter" aria-label="Previous chapter">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5.5v13L8 12Z"/><rect x="5" y="5.5" width="2.2" height="13" rx="1"/></svg>
          </button>
          <button class="icon-btn lg" id="prevVerse" title="Previous verse" aria-label="Previous verse">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 7.5 10 12l4.5 4.5"/></svg>
          </button>
          <button class="icon-btn lg" id="nextVerse" title="Next verse" aria-label="Next verse">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 7.5 4.5 4.5-4.5 4.5"/></svg>
          </button>
          <button class="icon-btn lg" id="nextChapter" title="Next chapter" aria-label="Next chapter">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.5v13L16 12Z"/><rect x="16.8" y="5.5" width="2.2" height="13" rx="1"/></svg>
          </button>
        </div>

        <div class="quick-row">
          <button class="pill" id="speedBtn">1.0&times;</button>
          <button class="pill" id="sleepBtn">Sleep timer</button>
          <button class="pill" id="voiceBtn">Voice</button>
          <button class="pill" id="bookmarkBtn">Bookmark</button>
          <button class="pill" id="shareBtn">Share verse</button>
        </div>
        <p class="sleep-note" id="sleepNote" hidden></p>
      </div>

      <div id="adSlotPlayer" class="ad-slot"></div>

      <div class="reader" id="reader"></div>
    </section>

    <!-- ── Library ────────────────────────────────────────────── -->
    <section class="view" data-view="library">
      <h2 class="view-title">Library</h2>
      <div class="seg" id="testamentSeg">
        <button class="seg-btn is-on" data-testament="OT">Old Testament</button>
        <button class="seg-btn" data-testament="NT">New Testament</button>
      </div>
      <div id="bookList" class="book-groups"></div>
    </section>

    <!-- ── Plans ──────────────────────────────────────────────── -->
    <section class="view" data-view="plans">
      <h2 class="view-title">Reading plans</h2>
      <div id="planActive"></div>
      <div id="planList" class="plan-list"></div>
    </section>

    <!-- ── Search ─────────────────────────────────────────────── -->
    <section class="view" data-view="search">
      <h2 class="view-title">Search</h2>
      <form class="search-bar" id="searchForm">
        <input type="search" id="searchInput" placeholder="Search the whole Bible&hellip;" autocomplete="off" spellcheck="false">
        <button type="submit" class="btn">Search</button>
      </form>
      <div id="searchStatus" class="muted"></div>
      <div id="searchResults" class="results"></div>
    </section>

    <!-- ── Give ───────────────────────────────────────────────── -->
    <section class="view" data-view="give">
      <div id="giveBody"></div>
    </section>

    <!-- ── Settings ───────────────────────────────────────────── -->
    <section class="view" data-view="settings">
      <h2 class="view-title">Settings</h2>
      <div id="settingsBody"></div>
    </section>

  </main>

  <!-- Mini player, shown on every view except Listen -->
  <button class="mini" id="mini" hidden>
    <span class="mini-bars" id="miniBars"><i></i><i></i><i></i></span>
    <span class="mini-text"><strong id="miniRef">Genesis 1</strong><small id="miniVerse">verse 1</small></span>
    <span class="mini-play" id="miniPlay" role="button" aria-label="Play or pause">
      <svg class="ico-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6L19 12Z"/></svg>
      <svg class="ico-pause" viewBox="0 0 24 24"><rect x="7" y="5" width="3.6" height="14" rx="1"/><rect x="13.4" y="5" width="3.6" height="14" rx="1"/></svg>
    </span>
  </button>

  <nav class="tabbar">
    <button data-nav="listen" class="is-on" aria-label="Listen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13a8 8 0 0 1 16 0"/><rect x="3" y="13" width="4" height="7" rx="2"/><rect x="17" y="13" width="4" height="7" rx="2"/></svg>
      <span>Listen</span>
    </button>
    <button data-nav="library" aria-label="Library">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5Z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5Z"/></svg>
      <span>Library</span>
    </button>
    <button data-nav="plans" aria-label="Reading plans">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M4 10h16M9 3.5v3M15 3.5v3"/></svg>
      <span>Plans</span>
    </button>
    <button data-nav="search" aria-label="Search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m15.5 15.5 4 4"/></svg>
      <span>Search</span>
    </button>
    <button data-nav="give" aria-label="Give a tip">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5S4 15.6 4 10.2A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 8 2.2c0 5.4-8 10.3-8 10.3Z"/></svg>
      <span>Give</span>
    </button>
  </nav>

</div>

<div class="sheet-scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
